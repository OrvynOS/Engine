<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orvyn Engine player</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0c10; color: #eee; font: 14px system-ui; }
  #stage { position: relative; width: 100vw; height: 100vh; display: grid; place-items: center; overflow: hidden; }
  canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="stage"><canvas id="game"></canvas></div>
<script type="module">
  // Local play: index.html?game=path/to/game.json (default: the example). Files the game names
  // are loaded relative to the game file.
  import { play } from "./dist/player.js";
  // Renderers (reel, Studio thumbnails) wait for this before capturing.
  let ready;
  window.__reelReady = new Promise((r) => (ready = r));
  const gameUrl = new URL(new URLSearchParams(location.search).get("game") ?? "../examples/lantern-run.json", location.href);
  const game = await (await fetch(gameUrl)).json();
  document.title = `${game.title} · Orvyn Engine`;
  try {
    window.player = await play({ canvas: document.getElementById("game"), wasm: "./dist/orvyn_engine.wasm", game, asset: (p) => new URL(p, gameUrl).href });
    // ?steps=120&hold=right: play that many frames holding those keys, then stop (thumbnails, checks).
    const q = new URLSearchParams(location.search);
    if (q.get("steps")) window.player.simulate(Number(q.get("steps")), (q.get("hold") ?? "").split(",").filter(Boolean));
  } catch (e) {
    document.getElementById("stage").textContent = e.message;
  }
  ready();
</script>
</body>
</html>
